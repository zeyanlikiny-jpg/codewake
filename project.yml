name: CodeWake
options:
  bundleIdPrefix: com.kenny
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Inject with `LIDLESS_DEVELOPMENT_TEAM=<TEAMID> xcodebuild ...` or an
    # uncommitted xcconfig. Never fall back to the upstream author's team.
    DEVELOPMENT_TEAM: "$(LIDLESS_DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Automatic

targets:
  Lidless:
    type: application
    platform: macOS
    sources:
      - Sources/Lidless
      - Sources/Shared
      - Resources/Assets.xcassets
      - Resources/Localizable.xcstrings
    info:
      path: Sources/Lidless/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: CodeWake
        CFBundleDisplayName: CodeWake
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: "© 2026 Kenny. Based on Lidless © 2026 Nghia Luong."
    settings:
      base:
        MARKETING_VERSION: "0.2.17"
        CURRENT_PROJECT_VERSION: "22"
        PRODUCT_NAME: CodeWake
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Debug builds get a `.dev` bundle id so a dev build coexists with the
        # released app — separate UserDefaults, login item, and helper daemon.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.kenny.lidlessai.dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.kenny.lidlessai
    dependencies:
      - target: LidlessHelper
        copy:
          destination: executables
      - target: LidlessAIHookBridge
        copy:
          destination: executables
      - target: LidlessDisplayWatchdog
        copy:
          destination: executables
    postBuildScripts:
      # Generate the privileged helper's LaunchDaemon plist from the app's bundle
      # id so the Release and `.dev` builds register isolated daemons. Runs before
      # the app is code-signed, so the plist is sealed into the bundle.
      - name: Generate helper LaunchDaemon plist
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          APP_ID="${PRODUCT_BUNDLE_IDENTIFIER}"
          HELPER_ID="${APP_ID}.helper"
          TEAM_ID="${DEVELOPMENT_TEAM:-TEAM_ID_NOT_CONFIGURED}"
          DEST="${CODESIGNING_FOLDER_PATH}/Contents/Library/LaunchDaemons"
          mkdir -p "$DEST"
          PLIST="${DEST}/${HELPER_ID}.plist"
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Label</key><string>'"${HELPER_ID}"'</string>
              <key>BundleProgram</key><string>Contents/MacOS/LidlessHelper</string>
              <key>RunAtLoad</key><true/>
              <key>KeepAlive</key><true/>
              <key>MachServices</key><dict><key>'"${HELPER_ID}"'</key><true/></dict>
              <key>AssociatedBundleIdentifiers</key><array><string>'"${APP_ID}"'</string></array>
              <key>EnvironmentVariables</key><dict>
                  <key>LIDLESS_MACH_LABEL</key><string>'"${HELPER_ID}"'</string>
                  <key>LIDLESS_ALLOWED_APP_BUNDLE_ID</key><string>'"${APP_ID}"'</string>
                  <key>LIDLESS_ALLOWED_TEAM_ID</key><string>'"${TEAM_ID}"'</string>
                  <key>LIDLESS_LEASE_JOURNAL_PATH</key><string>/Library/Application Support/'"${APP_ID}"'/helper-lease.json</string>
              </dict>
          </dict>
          </plist>' > "$PLIST"
          plutil -lint "$PLIST"

  LidlessHelper:
    type: tool
    platform: macOS
    sources:
      - Sources/Helper
      # Keep Agent events, Hook configuration, and user data out of the root
      # process. The helper compiles only its power/identity dependencies.
      - Sources/Shared/HelperProtocol.swift
      - Sources/Shared/HelperLease.swift
      - Sources/Shared/PowerParsers.swift
    settings:
      base:
        PRODUCT_NAME: LidlessHelper
        MARKETING_VERSION: "0.2.17"
        CURRENT_PROJECT_VERSION: "22"
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ENABLE_HARDENED_RUNTIME: YES
        # The helper is embedded into the app bundle via the Lidless target's
        # `copy: executables` dependency. Without this, the tool target is also
        # installed to Products/usr/local/bin in the archive, leaving two install
        # products so Xcode writes no ApplicationProperties — which makes
        # `xcodebuild -exportArchive` reject every distribution method.
        SKIP_INSTALL: YES
        # Embed an Info.plist (with CFBundleIdentifier) into the tool binary.
        # SMAppService daemons need this code identity to form the launch
        # constraint (LWCR) that ties the daemon to the app; without it macOS
        # refuses to exec the daemon ("could not find and/or execute program"
        # / copy_bundle_path error) and the helper never launches.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
      configs:
        # Helper bundle id tracks the app's (`<app id>.helper`) per build config.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.kenny.lidlessai.dev.helper
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.kenny.lidlessai.helper

  LidlessAIHookBridge:
    type: tool
    platform: macOS
    sources:
      - Sources/HookBridge
      - Sources/Shared/HookIntegrationModels.swift
      - Sources/Shared/HookIntegrationEvent.swift
    settings:
      base:
        PRODUCT_NAME: LidlessAIHookBridge
        MARKETING_VERSION: "0.2.17"
        CURRENT_PROJECT_VERSION: "22"
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.kenny.lidlessai.dev.hookbridge
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.kenny.lidlessai.hookbridge

  LidlessDisplayWatchdog:
    type: tool
    platform: macOS
    sources:
      - Sources/DisplayWatchdog
      # The watchdog intentionally compiles only the bounded v1 pipe protocol
      # and built-in-display transaction. It is a user-session child process;
      # it is neither a privileged helper nor a login item.
      - Sources/Shared/DisplayBlackoutProtocol.swift
      - Sources/Shared/BuiltInDisplayBrightnessController.swift
    settings:
      base:
        PRODUCT_NAME: LidlessDisplayWatchdog
        MARKETING_VERSION: "0.2.17"
        CURRENT_PROJECT_VERSION: "22"
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.kenny.lidless-ai.debug.displaywatchdog
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.kenny.lidless-ai.displaywatchdog

  LidlessTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LidlessTests
      - Sources/Shared
      - Resources/Localizable.xcstrings
      # Depend only on AppKit/SwiftUI, so they compile straight into the test
      # bundle without linking the app target.
      - Sources/Lidless/SettingsWindowController.swift
      - Sources/Lidless/PresentationLocalization.swift
      - Sources/Lidless/MenuBarExtraPanel.swift
      - Sources/Lidless/MenuBarLogoDoubleClickController.swift
      - Sources/Lidless/MenuPopoverLayout.swift
      - Sources/Lidless/DisplayTopologyMonitor.swift
      - Sources/Lidless/AudioInputDeviceController.swift
      - Sources/Lidless/DisplaySleepAssertionController.swift
      - Sources/Lidless/AllDisplaysSleepController.swift
      - Sources/Lidless/DisplayBlackoutSupervisor.swift
      - Sources/Lidless/AgentProcessMonitor.swift
      - Sources/Lidless/CodexCancellationObserver.swift
      - Sources/Lidless/AgentEventSocketServer.swift
      - Sources/HookBridge/HookBridgeSocketClient.swift
      # Exercise watchdog lifecycle and protocol without compiling its main.swift.
      - Sources/DisplayWatchdog/DisplayBlackoutWatchdog.swift
      # Compile the production service into tests without the helper entry point.
      - Sources/Helper/HelperService.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenny.lidlessaiTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CodeWake:
    build:
      targets:
        Lidless: all
    run:
      config: Debug
    archive:
      config: Release
  CodeWake-CI:
    build:
      targets:
        Lidless: all
        LidlessHelper: all
        LidlessAIHookBridge: all
        LidlessDisplayWatchdog: all
        LidlessTests: [test]
    test:
      targets:
        - LidlessTests
